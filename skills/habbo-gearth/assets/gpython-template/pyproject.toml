[project]
name = "__DIST__"
version = "0.1.0"
description = "__DESC__"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 0.1.6 is the last working release; G-Python's GitHub main has a circular import.
    "g-python==0.1.6",
]

[project.scripts]
__DIST__ = "__PKG__.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/__PKG__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# g-python 0.1.6 compares strings with `is not`, which warns on Python 3.12+.
filterwarnings = ["ignore::SyntaxWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
# S101: assert is fine in tests. E501: `ruff format` keeps code within line-length;
# long strings (titles, descriptions) are allowed to run over.
ignore = ["S101", "E501"]
